<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-grid" aria-hidden="true"></div>

  <main class="container">

    <header class="header">
      <div class="lock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Password<br/><span class="accent">Strength</span></h1>
      <p class="subtitle">Type a password to see how secure it really is</p>
    </header>

    <div class="card">

      <div class="input-wrapper">
        <label for="password-input" class="sr-only">Password</label>
        <input
          id="password-input"
          type="password"
          class="password-input"
          placeholder="Enter your password…"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          id="toggle-visibility"
          class="icon-btn"
          aria-label="Show password"
          title="Show / hide password"
        >
          <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="eye-closed" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <div class="strength-section" aria-live="polite" aria-label="Password strength">
        <div class="strength-header">
          <span class="strength-label">Strength</span>
          <span id="strength-text" class="strength-text">—</span>
        </div>
        <div class="bar-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="4">
          <div id="strength-bar" class="bar-fill"></div>
        </div>
        <div class="bar-segments" aria-hidden="true">
          <div class="seg" id="seg-1"></div>
          <div class="seg" id="seg-2"></div>
          <div class="seg" id="seg-3"></div>
          <div class="seg" id="seg-4"></div>
        </div>
      </div>

      <div class="rules-grid" role="list" aria-label="Password requirements">
        <div class="rule" id="rule-length" role="listitem">
          <span class="rule-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <span class="rule-text">At least 8 characters</span>
        </div>
        <div class="rule" id="rule-number" role="listitem">
          <span class="rule-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <span class="rule-text">Contains a number</span>
        </div>
        <div class="rule" id="rule-upper" role="listitem">
          <span class="rule-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <span class="rule-text">Contains uppercase letter</span>
        </div>
        <div class="rule" id="rule-special" role="listitem">
          <span class="rule-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </span>
          <span class="rule-text">Contains special character</span>
        </div>
      </div>

      <div class="actions">
        <button id="generate-btn" class="btn btn-generate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Generate password
        </button>
        <button id="copy-btn" class="btn btn-copy" aria-label="Copy password to clipboard">
          <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <svg id="check-icon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span id="copy-text">Copy</span>
        </button>
      </div>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
